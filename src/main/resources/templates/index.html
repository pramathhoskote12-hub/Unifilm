<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>UniFilm</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>


<body>


<!-- TOP BAR -->

<header class="top-bar">

    <a href="/"
       class="logo">

        UniFilm

    </a>

</header>



<!-- MAIN CONTENT -->

<main class="main-content">


    <!-- SEARCH -->

    <div class="search-container">

        <div class="search-input-wrapper">

            <input
                    class="search-bar"
                    id="searchBar"
                    type="text"
                    placeholder="Search for a movie or anime..."
                    autocomplete="off"
            >

            <button
                    class="clear-search"
                    id="clearSearch"
                    type="button">

                ×

            </button>

        </div>


        <div
                id="searchResults"
                class="search-results">

        </div>

    </div>



    <!-- TOP 10 -->

    <section class="section">

        <h2 class="section-title">
            Top 10 This Month
        </h2>


        <div class="moving-poster-container">

            <div
                    class="moving-poster"
                    id="top10Poster">

                Movie 1

            </div>


            <div
                    class="poster-number"
                    id="posterNumber">

                1 / 10

            </div>

        </div>

    </section>



    <section class="monthly-pick-section">

        <h2>Monthly Pick</h2>

        <p>
            Vote for the movie you want the film club
            to show at the university.
        </p>

        <div class="podium">

            <!-- 2nd Place -->

            <div class="podium-movie second">

                <div class="rank-badge silver">
                    2
                </div>

                <div class="monthly-poster">
                    Movie 2
                </div>

                <h3>Movie 2</h3>

            </div>


            <!-- 1st Place -->

            <div class="podium-movie first">

                <div class="rank-badge gold">
                    1
                </div>

                <div class="monthly-poster">
                    Movie 1
                </div>

                <h3>Movie 1</h3>

            </div>


            <!-- 3rd Place -->

            <div class="podium-movie third">

                <div class="rank-badge bronze">
                    3
                </div>

                <div class="monthly-poster">
                    Movie 3
                </div>

                <h3>Movie 3</h3>

            </div>

        </div>

        <button class="monthly-vote-btn">
            Vote for Monthly Pick
        </button>

    </section>


</main>



<script src="/js/app.js"></script>

</body>

</html>
